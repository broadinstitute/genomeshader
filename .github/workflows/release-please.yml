name: Release Please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Uses GITHUB_TOKEN, so the GitHub Release/tag it creates does not start
      # other workflows. publish.yml listens for this workflow completing and
      # publishes only when a v* tag points at the triggering commit.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json

